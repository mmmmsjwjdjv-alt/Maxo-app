name: Build MAXO APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Auto-Heal Project Configuration and Dependencies
        run: |
          chmod +x gradlew || true

          # 1. Ensure Root build.gradle.kts exists
          if [ ! -f build.gradle.kts ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
            alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          # 2. Ensure settings.gradle.kts exists
          if [ ! -f settings.gradle.kts ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google {
                content {
                  includeGroupByRegex("com\\.android.*")
                  includeGroupByRegex("com\\.google.*")
                  includeGroupByRegex("androidx.*")
                }
              }
              mavenCentral()
              gradlePluginPortal()
            }
          }
          plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "MAXO"
          include(":app")
          EOF
          fi

          # 3. Ensure gradle.properties exists
          if [ ! -f gradle.properties ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          fi

          # 4. Ensure Secrets environment files exist
          touch .env .env.example

          # 5. Ensure Debug Keystore exists
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 6. Ensure Compose Typography exists
          mkdir -p app/src/main/java/com/example/ui/theme
          if [ ! -f app/src/main/java/com/example/ui/theme/Type.kt ]; then
            cat << 'EOF' > app/src/main/java/com/example/ui/theme/Type.kt
          package com.example.ui.theme
          import androidx.compose.material3.Typography
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.sp
          val Typography = Typography(
              bodyLarge = TextStyle(
                  fontFamily = FontFamily.Default,
                  fontWeight = FontWeight.Normal,
                  fontSize = 16.sp,
                  lineHeight = 24.sp,
                  letterSpacing = 0.5.sp,
              )
          )
          EOF
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAXO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
